<body>

<!-- the rooms: one picture each, built by src/world/main.js from src/world/rooms.js -->
<div class="wd-stage" data-stage></div>
<div class="grain" data-grain aria-hidden="true"></div>
<svg class="defs" width="0" height="0" aria-hidden="true"><defs data-defs></defs></svg>

<header class="hd">
  <a class="hd-name" href="../" aria-label="Matt King — back to the story">Matt King</a>
  <p class="hd-label mono" data-loc aria-hidden="true">The penthouse · London</p>
  <div class="hd-right">
    <a class="hd-cta" href="../">← The story</a>
  </div>
  <div class="hd-bar" aria-hidden="true"><i></i></div>
</header>

<main>

<h1 class="wd-sr">The virtual world: Matt King's penthouse, room by room</h1>

<p class="mono wd-hint" aria-hidden="true">Drag to look around</p>

<!-- the arrows to the rooms either side -->
<button class="wd-arrow wd-prev" type="button" data-prev><i aria-hidden="true">←</i><span class="wd-arrow-l" aria-hidden="true"><b></b></span></button>
<button class="wd-arrow wd-next" type="button" data-next><span class="wd-arrow-l" aria-hidden="true"><b></b></span><i aria-hidden="true">→</i></button>

<!-- what a marker opens -->
<aside class="wd-card" data-card tabindex="-1" role="dialog" aria-labelledby="wd-card-t" hidden>
  <button class="wd-card-x" type="button" data-card-close aria-label="Close"><i aria-hidden="true">×</i></button>
  <div class="wd-card-body" data-card-body></div>
</aside>

<!-- a screen's video, opened full screen with sound -->
<div class="wd-cinema" data-cinema role="dialog" aria-label="Video" hidden>
  <video data-cinema-video controls playsinline></video>
  <button class="wd-cinema-x" type="button" data-cinema-close aria-label="Close the video"><i aria-hidden="true">×</i></button>
</div>

<!-- the music player: opened by the speaker. It stays put from room to room, so the music keeps playing. -->
<aside class="wd-music" data-music aria-label="Music" hidden>
  <div class="wd-music-k"><span class="mono">On the speakers</span><button class="wd-music-x" type="button" data-music-close aria-label="Stop the music and close the player"><i aria-hidden="true">×</i></button></div>
  <div class="wd-music-frame" data-music-frame></div>
</aside>

<!-- travelling: on the jet, where to land -->
<nav class="wd-fly" data-fly aria-label="Travel"></nav>

<!-- Explore: bottom left. Opens the list of rooms over the blurred room. -->
<div class="wd-shade" data-shade aria-hidden="true"></div>
<nav class="wd-menu wd-places" data-places aria-label="Other places" inert></nav>
<div class="wd-ex">
  <nav class="wd-menu" id="wd-menu" data-menu aria-label="Rooms" inert></nav>
  <button class="wd-explore" type="button" data-explore aria-expanded="false" aria-controls="wd-menu">Explore</button>
  <p class="wd-sr" data-where aria-live="polite"></p>
</div>

</main>

<script type="module" src="/src/world/main.js"></script>
</body>
</html>
